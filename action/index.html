<title>난세무쌍</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="난세무쌍">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap">
<link rel="stylesheet" href="style.css">

<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="게임 화면"></canvas>

    <div id="hud" hidden>
      <div id="h-boss" hidden>
        <span id="h-bossname"></span>
        <div class="bossbar"><i id="h-bossbar"></i></div>
        <span id="h-bosshp" class="num"></span>
      </div>
      <div id="h-quest"></div>
      <div id="h-log" aria-live="polite"></div>
    </div>

    <div id="touch" hidden>
      <div class="dpad" data-dpad>
        <button data-key="up" class="up" aria-label="위">▲</button>
        <button data-key="left" class="left" aria-label="왼쪽">◀</button>
        <button data-key="right" class="right" aria-label="오른쪽">▶</button>
        <button data-key="down" class="down" aria-label="아래">▼</button>
      </div>
      <div class="acts">
        <button data-key="A" class="sk">A</button>
        <button data-key="S" class="sk">S</button>
        <button data-key="D" class="sk">D</button>
        <button data-key="jump" class="jump">점프</button>
        <button data-key="attack" class="attack">공격</button>
      </div>
    </div>

    <div id="overlay"></div>
  </div>

  <footer id="bar" hidden>
    <div class="xp"><i id="h-xpbar"></i><span id="h-xp" class="num"></span></div>
    <div class="bar-row">
      <div class="who"><b id="h-lv" class="num"></b><span id="h-name"></span></div>
      <div class="gauges">
        <div class="g hp"><span>HP</span><div><i id="h-hpbar"></i></div><em id="h-hp" class="num"></em></div>
        <div class="g mp"><span>MP</span><div><i id="h-mpbar"></i></div><em id="h-mp" class="num"></em></div>
      </div>
      <div id="h-slots" class="slots"></div>
      <div class="purse"><span class="coin" aria-hidden="true"></span><b id="h-gold" class="num"></b><span class="unit">전</span>
        <button id="menu-btn" class="menu">메뉴</button></div>
    </div>
  </footer>
</div>

<script src="js/data.js"></script>
<script src="js/draw.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
